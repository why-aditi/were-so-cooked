name: synthetic

# Section 13: hourly synthetic check of /healthz and the demo flow. Opens a
# GitHub issue on failure and closes it on recovery.
on:
  schedule:
    - cron: '7 * * * *' # :07 rather than :00 — GitHub's scheduler is busiest on the hour
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: synthetic
  cancel-in-progress: true

env:
  ISSUE_TITLE: 'Synthetic check failing'

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.probe.outputs.failed }}
      detail: ${{ steps.probe.outputs.detail }}
    steps:
      - name: Check /healthz and the demo flow
        id: probe
        env:
          PROD_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set +e
          detail=""
          failed=false

          if [ -z "$PROD_URL" ]; then
            echo "::error::PRODUCTION_URL repository variable is not set"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "detail=PRODUCTION_URL is not configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Shallow by design: ?deep=1 would spend neurons every hour, and
          # Workers AI is the budget that actually binds (section 12).
          code=$(curl -sS --max-time 20 -o /tmp/h.json -w '%{http_code}' "$PROD_URL/healthz")
          if [ "$code" != "200" ]; then
            failed=true
            detail="$detail/healthz returned HTTP $code. Body: $(head -c 400 /tmp/h.json 2>/dev/null). "
          fi

          demo=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST "$PROD_URL/auth/demo")
          if [ "$demo" = "404" ]; then
            detail="$detail/auth/demo not implemented yet, skipped. "
          elif [ "$demo" != "200" ]; then
            failed=true
            detail="$detail/auth/demo returned HTTP $demo. "
          fi

          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "$detail"

  report:
    name: Open or close the incident issue
    needs: probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const failed = '${{ needs.probe.outputs.failed }}' === 'true';
            const detail = `${{ toJSON(needs.probe.outputs.detail) }}`;
            const title = process.env.ISSUE_TITLE || 'Synthetic check failing';

            // Find an existing open incident rather than filing one per hour.
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'synthetic',
            });
            const existing = open.find((i) => i.title === title);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (failed) {
              const body = `Synthetic check failed at ${new Date().toISOString()}.\n\n${detail}\n\n[Run](${run})`;
              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: existing.number, body: `Still failing.\n\n${detail}\n\n[Run](${run})`,
                });
                core.setFailed(`Synthetic check still failing (#${existing.number})`);
              } else {
                const { data: created } = await github.rest.issues.create({
                  ...context.repo, title, body, labels: ['synthetic', 'incident'],
                });
                core.setFailed(`Synthetic check failing — opened #${created.number}`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number,
                body: `Recovered at ${new Date().toISOString()}. Closing.\n\n[Run](${run})`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed',
              });
              console.log(`Recovered — closed #${existing.number}`);
            } else {
              console.log('Healthy.');
            }
        env:
          ISSUE_TITLE: ${{ env.ISSUE_TITLE }}
